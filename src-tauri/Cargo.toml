[package]
name = "liuguang-ys"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"
serde = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
