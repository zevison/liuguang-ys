<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="映界 · 多源影视聚合搜索，一键搜索全网视频资源" />
    <meta name="theme-color" content="#060E1A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="映界" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2" />
    <title>映界 · 多源影视搜索</title>

    <!-- CDN 预连接：changzhangm3u8 解析出的封面/API/m3u8 CDN 域名
         preconnect 提前建 TCP+TLS 连接 → 首次请求省 ~100ms
         dns-prefetch 兜底老浏览器 -->
    <link rel="preconnect" href="https://p1.czzyplay.com" crossorigin />
    <link rel="preconnect" href="https://changzhang.tv" crossorigin />
    <link rel="preconnect" href="https://svip.czzyplay.com" crossorigin />
    <link rel="dns-prefetch" href="https://p1.czzyplay.com" />
    <link rel="dns-prefetch" href="https://changzhang.tv" />
    <link rel="dns-prefetch" href="https://svip.czzyplay.com" />

    <!-- 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- PWA Service Worker（后台注册，不阻塞首屏） -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {})
        })
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
