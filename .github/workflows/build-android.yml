name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Android SDK
      run: |
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" \
          "platform-tools"

    - name: Install all deps
      run: |
        npm ci || npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android --save

    - name: Build web
      run: npm run build:ci

    - name: Capacitor Android setup
      run: |
        npx cap add android 2>&1 || true
        npx cap copy android
        npx cap sync android

    - name: Configure release signing
      run: |
        echo "=== 写入 gradle.properties ==="
        cat >> android/gradle.properties << EOF
        ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks
        ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASS }}
        ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASS }}
        EOF
        echo "=== 注入 release signing 到 app/build.gradle ==="
        cat >> android/app/build.gradle << 'GDEOF'

        android {
          signingConfigs {
            release {
              storeFile file(ANDROID_KEYSTORE_PATH)
              storePassword ANDROID_KEYSTORE_PASSWORD
              keyAlias ANDROID_KEY_ALIAS
              keyPassword ANDROID_KEY_PASSWORD
            }
          }
          buildTypes {
            release {
              signingConfig signingConfigs.release
              minifyEnabled false
            }
          }
        }
        GDEOF
      env:
        GITHUB_WORKSPACE: ${{ github.workspace }}

    - name: Decode keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks
        ls -la release-keystore.jks

    - name: Build RELEASE APK
      working-directory: android
      run: ./gradlew assembleRelease
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: liuguang-ys-apk-release
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Upload debug APK (fallback)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: liuguang-ys-apk-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
