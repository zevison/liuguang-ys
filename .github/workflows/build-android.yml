name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Install Android SDK
      run: |
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-34" \
          "build-tools;34.0.0" \
          "platform-tools"

    - name: Install all deps
      run: |
        npm ci || npm install
        npm install \
          @capacitor/core \
          @capacitor/cli \
          @capacitor/android \
          @capacitor/status-bar \
          @capacitor/splash-screen \
          --save

    - name: Build web
      run: npm run build:ci

    - name: Capacitor Android setup
      run: |
        npx cap add android 2>&1 || true
        npx cap copy android
        npx cap sync android
        npx cap update android 2>&1 || true

    - name: Patch AndroidManifest (edge-to-edge + orientation)
      run: |
        MF="android/app/src/main/AndroidManifest.xml"
        echo "=== Before ==="
        grep -A2 'application\|activity' "$MF" | head -10

        # 1. Application tag 加 allowBackup + usesCleartextTraffic + networkSecurityConfig
        sed -i 's|<application\([^>]*\)>|<application\1 android:allowBackup="true" android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config">|' "$MF"

        # 2. Main Activity 加 configChanges + launchMode
        sed -i 's|android:name="\.MainActivity"|android:name=".MainActivity" android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|uiMode" android:launchMode="singleTask"|' "$MF"

        echo ""
        echo "=== After ==="
        grep -A2 'application\|activity' "$MF" | head -10

    - name: Create immersive theme + network security config
      run: |
        # styles.xml — edge-to-edge + 黑色透明状态栏
        mkdir -p android/app/src/main/res/values-v23
        cat > android/app/src/main/res/values-v23/styles.xml << 'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
          <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
            <item name="android:windowTranslucentStatus">false</item>
            <item name="android:windowTranslucentNavigation">false</item>
            <item name="android:statusBarColor">@android:color/black</item>
            <item name="android:navigationBarColor">@android:color/black</item>
            <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
          </style>
        </resources>
        XML

        # network_security_config — 允许 HTTP（代理接口）
        mkdir -p android/app/src/main/res/xml
        cat > android/app/src/main/res/xml/network_security_config.xml << 'XML'
        <?xml version="1.0" encoding="utf-8"?>
        <network-security-config>
          <domain-config cleartextTrafficPermitted="true">
            <domain includeSubdomains="true">localhost</domain>
            <domain includeSubdomains="true">10.0.2.2</domain>
            <domain includeSubdomains="true">192.168.0.0/16</domain>
          </domain-config>
          <base-config cleartextTrafficPermitted="true">
            <trust-anchors>
              <certificates src="system" />
            </trust-anchors>
          </base-config>
        </network-security-config>
        XML

        echo "✅ themes + network security written"

    - name: Configure release signing
      run: |
        echo "=== gradle.properties ==="
        cat >> android/gradle.properties << EOF
        ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks
        ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASS }}
        ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASS }}
        EOF
        echo "=== release signing ==="
        cat >> android/app/build.gradle << 'GDEOF'

        android {
          signingConfigs {
            release {
              storeFile file(ANDROID_KEYSTORE_PATH)
              storePassword ANDROID_KEYSTORE_PASSWORD
              keyAlias ANDROID_KEY_ALIAS
              keyPassword ANDROID_KEY_PASSWORD
            }
          }
          buildTypes {
            release {
              signingConfig signingConfigs.release
              minifyEnabled false
            }
          }
          buildFeatures {
            viewBinding true
          }
        }
        GDEOF
      env:
        GITHUB_WORKSPACE: ${{ github.workspace }}

    - name: Decode keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks
        ls -la release-keystore.jks

    - name: Build RELEASE APK
      working-directory: android
      run: ./gradlew assembleRelease
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: liuguang-ys-apk-release
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Upload debug APK (fallback)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: liuguang-ys-apk-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
