name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install deps
      run: npm ci || npm install
      shell: bash

    - name: Build web
      run: npm run build:ci
      shell: bash

    - name: Install Tauri
      run: npm install @tauri-apps/cli@^2 @tauri-apps/api@^2
      shell: bash

    - name: Create src-tauri structure
      run: |
        mkdir -p src-tauri/src src-tauri/capabilities
        cat > tauri.conf.json << 'EOF'
        {
          "$schema": "https://schema.tauri.app/config/2",
          "productName": "映界",
          "version": "1.0.0",
          "identifier": "com.liuguang.ys",
          "build": {
            "beforeDevCommand": "npm run dev",
            "beforeBuildCommand": "npm run build:ci",
            "devUrl": "http://localhost:5173",
            "frontendDist": "../dist"
          },
          "app": {
            "windows": [{
              "title": "映界",
              "width": 1280,
              "height": 800,
              "resizable": true,
              "fullscreen": false
            }],
            "security": { "csp": null }
          },
          "bundle": {
            "active": true,
            "targets": ["nsis"],
            "icon": ["public/icon-512.png"]
          }
        }
        EOF
        cp tauri.conf.json src-tauri/tauri.conf.json

        cat > src-tauri/Cargo.toml << 'EOF'
        [package]
        name = "liuguang-ys"
        version = "1.0.0"
        edition = "2021"

        [lib]
        crate-type = ["staticlib", "cdylib", "rlib"]

        [build-dependencies]
        tauri-build = { version = "2", features = [] }

        [dependencies]
        tauri = { version = "2", features = [] }
        tauri-plugin-shell = "2"
        serde_json = "1"
        serde = "1"

        [features]
        default = ["custom-protocol"]
        custom-protocol = ["tauri/custom-protocol"]
        EOF

        cat > src-tauri/build.rs << 'EOF'
        fn main() { tauri_build::build() }
        EOF

        cat > src-tauri/src/main.rs << 'EOF'
        #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]
        fn main() { liuguang_ys_lib::run() }
        EOF

        cat > src-tauri/src/lib.rs << 'EOF'
        #[cfg_attr(mobile, tauri::mobile_entry_point)]
        pub fn run() {
          tauri::Builder::default()
            .plugin(tauri_plugin_shell::init())
            .run(tauri::generate_context!())
            .expect("error while running tauri app")
        }
        EOF
      shell: bash

    - name: Tauri build EXE
      run: npx tauri build
      shell: bash

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: liuguang-ys-exe
        path: |
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/*.exe
