name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install deps + build web
      run: |
        npm ci || npm install
        npm run build:ci
      shell: bash

    - name: Install Tauri CLI
      run: npm install @tauri-apps/cli@^2 @tauri-apps/api@^2
      shell: bash

    - name: Build Windows NSIS + MSI
      working-directory: src-tauri
      run: npx tauri build --bundles nsis
      shell: bash

    - name: Verify bundles
      run: |
        echo "=== NSIS ==="
        ls -la src-tauri/target/release/bundle/nsis/ 2>/dev/null || echo "no nsis"
        echo "=== MSI ==="
        ls -la src-tauri/target/release/bundle/msi/ 2>/dev/null || echo "no msi"
      shell: bash

    - name: Upload NSIS installer
      uses: actions/upload-artifact@v4
      with:
        name: liuguang-ys-windows-setup
        path: src-tauri/target/release/bundle/nsis/*.exe

    - name: Upload MSI installer
      uses: actions/upload-artifact@v4
      with:
        name: liuguang-ys-windows-msi
        path: src-tauri/target/release/bundle/msi/*.msi
