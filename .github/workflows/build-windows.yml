name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install deps
      run: npm ci || npm install
      shell: bash

    - name: Build web
      run: npm run build:ci
      shell: bash

    - name: Install Tauri CLI
      run: npm install @tauri-apps/cli@^2 @tauri-apps/api@^2
      shell: bash

    - name: Init Tauri
      run: |
        if [ ! -d src-tauri ]; then
          npx tauri init --app-name "映界" --window-title "映界" --dist-dir "../dist" --dev-url "http://localhost:5173" --before-dev-command "npm run dev" --before-build-command "npm run build:ci" --ci
        fi
      shell: bash

    - name: Build EXE
      run: npx tauri build
      shell: bash

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: liuguang-ys-exe
        path: |
          src-tauri/target/release/bundle/msi/*.msi
          src-tauri/target/release/bundle/nsis/*.exe
          src-tauri/target/release/*.exe
